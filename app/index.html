<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Fresh Breaks" />
    <meta name="description" content="One small break, when you need it." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700;800&display=swap" rel="stylesheet" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/favicon.svg" color="#FFCC00" />

    <title>Fresh Breaks</title>

    <style>
      /* Pre-JS splash. React unmounts this when it mounts into #root. */
      .fb-splash {
        position: fixed;
        inset: 0;
        background: #FFFFFF;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: 'Outfit', system-ui, -apple-system, 'Helvetica Neue', sans-serif;
        z-index: 0;
      }
      .fb-splash__mark {
        position: relative;
        width: 96px;
        height: 96px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .fb-splash__ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 1.5px solid #FFCC00;
        opacity: 0;
        animation: fb-splash-ring 4s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
      }
      .fb-splash__wordmark {
        margin-top: 32px;
        font-weight: 800;
        font-size: 28px;
        letter-spacing: -0.025em;
        line-height: 1;
        color: #040F32;
      }
      @keyframes fb-splash-ring {
        0%   { transform: scale(0.85); opacity: 0;   }
        40%  { transform: scale(1.25); opacity: 0.7; }
        70%  { transform: scale(1.6);  opacity: 0;   }
        100% { transform: scale(1.6);  opacity: 0;   }
      }
      @media (prefers-reduced-motion: reduce) {
        .fb-splash__ring { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="fb-splash" aria-hidden="true">
        <div class="fb-splash__mark">
          <span class="fb-splash__ring"></span>
          <img src="/mark.svg" width="96" height="96" alt="" />
        </div>
        <div class="fb-splash__wordmark">Fresh Breaks</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
